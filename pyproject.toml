[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "study-desk"
version = "0.1.0"
description = "Local-first desktop textbook notes and exam analysis"
requires-python = ">=3.11"
dependencies = ["pypdf==6.20.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
study-desk = "study_desk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
